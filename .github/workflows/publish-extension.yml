name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only (do not publish)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npm run typecheck
        working-directory: .

      - name: Build engine + extension bundle
        run: npm run package:prepare

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: roots-vscode-vsix
          path: packages/vscode/*.vsix

      - name: Publish to Marketplace
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        run: npx --yes @vscode/vsce publish --no-dependencies --allow-missing-repository
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
