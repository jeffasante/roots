name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only (do not publish)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Typecheck
        run: npm run typecheck
        working-directory: .

      - name: Build engine + extension bundle
        run: npm run package:prepare

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --allow-missing-repository

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: roots-vscode-vsix
          path: packages/vscode/*.vsix

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const vsix = fs.readdirSync('packages/vscode').find(f => f.endsWith('.vsix'));
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              body: `See the [commit](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}) for changes.`,
            });
            if (vsix) {
              const filePath = `packages/vscode/${vsix}`;
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: vsix,
                data: fs.readFileSync(filePath),
              });
            }
